services:
  db:
    image: postgres:15-alpine
    container_name: pos_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # Solo accesible desde este host, no desde la red
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_pos_maestro.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pos_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      PORT: 4000
      NEGOCIO_NOMBRE: Mi Negocio
      SCHEMA_PATH: /app/schema_pos_maestro.sql
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      POS_SESSION_SECRET: ${POS_SESSION_SECRET:?POS_SESSION_SECRET no definida - agrega esta variable al archivo .env}
    volumes:
      - ./schema_pos_maestro.sql:/app/schema_pos_maestro.sql:ro
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pos_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data: